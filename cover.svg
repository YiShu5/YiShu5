<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141925"/>
    </linearGradient>

    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3DB7E4"/>
      <stop offset="100%" stop-color="#1E7FB8"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4F4F8"/>
      <stop offset="100%" stop-color="#A8B2C7"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3DB7E4"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#CD6E58"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="0.5"/>
    </pattern>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- background layers -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- ambient glow blobs -->
  <ellipse cx="900" cy="200" rx="280" ry="200" fill="#3DB7E4" opacity="0.12" filter="url(#soft)"/>
  <ellipse cx="200" cy="350" rx="220" ry="160" fill="#CD6E58" opacity="0.08" filter="url(#soft)"/>

  <!-- corner mark (top-left) -->
  <g transform="translate(40,40)">
    <rect width="14" height="2" fill="url(#accent)"/>
    <rect width="2" height="14" fill="url(#accent)"/>
  </g>
  <g transform="translate(1146,40) rotate(90)">
    <rect width="14" height="2" fill="url(#accent)"/>
    <rect width="2" height="14" fill="url(#accent)"/>
  </g>
  <g transform="translate(40,346) rotate(-90)">
    <rect width="14" height="2" fill="url(#accent)"/>
    <rect width="2" height="14" fill="url(#accent)"/>
  </g>
  <g transform="translate(1146,346) rotate(180)">
    <rect width="14" height="2" fill="url(#accent)"/>
    <rect width="2" height="14" fill="url(#accent)"/>
  </g>

  <!-- LEFT: Identity block -->
  <g transform="translate(80,110)">
    <!-- small label -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="13" font-weight="600" fill="#3DB7E4" letter-spacing="3">
      AI PRODUCT BUILDER · BEIJING
    </text>

    <!-- main name -->
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
      font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-2">
      意疏 / Doraemon
    </text>

    <!-- divider -->
    <rect x="0" y="86" width="60" height="3" fill="url(#accent)"/>

    <!-- subtitle -->
    <text x="0" y="124" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
      font-size="18" font-weight="400" fill="#8b949e">
      从零售一线运营，到 AI 驱动型产品构建者
    </text>

    <!-- tagline -->
    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
      font-size="14" font-weight="500" fill="#5b6478" font-style="italic">
      "可运行的工具，胜过一百份培训文档。"
    </text>

    <!-- chip row -->
    <g transform="translate(0,184)" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
      <g>
        <rect width="78" height="22" rx="11" fill="#3DB7E420" stroke="#3DB7E450"/>
        <text x="39" y="15" fill="#3DB7E4" text-anchor="middle">AI BUILDER</text>
      </g>
      <g transform="translate(86,0)">
        <rect width="86" height="22" rx="11" fill="#818cf820" stroke="#818cf850"/>
        <text x="43" y="15" fill="#818cf8" text-anchor="middle">RETAIL OPS</text>
      </g>
      <g transform="translate(180,0)">
        <rect width="100" height="22" rx="11" fill="#CD6E5820" stroke="#CD6E5850"/>
        <text x="50" y="15" fill="#CD6E58" text-anchor="middle">CLAUDE SKILLS</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: Doraemon Pocket scene -->
  <g transform="translate(820,80)">
    <!-- Pocket body (semi-circle with curve) -->
    <path d="M 30 100 Q 30 30 150 30 Q 270 30 270 100 L 270 240 Q 270 260 250 260 L 50 260 Q 30 260 30 240 Z"
      fill="url(#pocket)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- Pocket rim highlight -->
    <path d="M 30 100 Q 30 30 150 30 Q 270 30 270 100" fill="none" stroke="url(#rim)" stroke-width="2"/>

    <!-- Inner pocket shadow -->
    <ellipse cx="150" cy="80" rx="100" ry="20" fill="#000000" opacity="0.25"/>

    <!-- Items spilling out of pocket -->

    <!-- 1. Clawd (pixel crab) - center, peeking out -->
    <g transform="translate(110,40)">
      <!-- shadow under crab -->
      <ellipse cx="40" cy="55" rx="32" ry="4" fill="#000" opacity="0.2"/>
      <!-- crab body (simplified pixel) -->
      <rect x="20" y="20" width="40" height="20" fill="#CD6E58"/>
      <rect x="14" y="26" width="52" height="8" fill="#CD6E58"/>
      <!-- eyes -->
      <rect x="28" y="26" width="3" height="3" fill="#000"/>
      <rect x="49" y="26" width="3" height="3" fill="#000"/>
      <!-- claws -->
      <rect x="6" y="30" width="8" height="8" fill="#CD6E58"/>
      <rect x="66" y="30" width="8" height="8" fill="#CD6E58"/>
      <!-- legs -->
      <rect x="22" y="40" width="2" height="6" fill="#CD6E58"/>
      <rect x="30" y="40" width="2" height="6" fill="#CD6E58"/>
      <rect x="48" y="40" width="2" height="6" fill="#CD6E58"/>
      <rect x="56" y="40" width="2" height="6" fill="#CD6E58"/>
    </g>

    <!-- 2. Pen icon (left) -->
    <g transform="translate(40,10) rotate(-20)">
      <rect x="0" y="0" width="6" height="60" fill="#F4F4F8" rx="1"/>
      <polygon points="0,60 3,68 6,60" fill="#1a1a1a"/>
      <rect x="0" y="0" width="6" height="10" fill="#818cf8" rx="1"/>
    </g>

    <!-- 3. Lightbulb (right) -->
    <g transform="translate(220,15)">
      <ellipse cx="12" cy="14" rx="12" ry="14" fill="#fbbf24" opacity="0.95"/>
      <rect x="6" y="26" width="12" height="5" fill="#9ca3af" rx="1"/>
      <rect x="7" y="32" width="10" height="3" fill="#6b7280" rx="1"/>
      <!-- glow -->
      <ellipse cx="12" cy="14" rx="20" ry="22" fill="#fbbf24" opacity="0.15"/>
    </g>

    <!-- 4. Sparkles -->
    <g fill="#FFFFFF">
      <circle cx="20" cy="80" r="2" opacity="0.8"/>
      <circle cx="270" cy="120" r="1.5" opacity="0.6"/>
      <circle cx="80" cy="180" r="1" opacity="0.7"/>
      <circle cx="240" cy="200" r="2" opacity="0.5"/>
      <circle cx="160" cy="220" r="1.2" opacity="0.6"/>
    </g>

    <!-- pocket label -->
    <text x="150" y="170" font-family="-apple-system, 'PingFang SC', sans-serif"
      font-size="11" font-weight="700" fill="#FFFFFF" opacity="0.9" text-anchor="middle" letter-spacing="2">
      AI POCKET
    </text>
    <line x1="100" y1="180" x2="200" y2="180" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="150" y="200" font-family="-apple-system, 'PingFang SC', sans-serif"
      font-size="9" font-weight="500" fill="#FFFFFF" opacity="0.6" text-anchor="middle" letter-spacing="1">
      四次元 · 工具仓库
    </text>
  </g>

  <!-- bottom corner stat -->
  <text x="80" y="370" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#5b6478" letter-spacing="1">
    GITHUB.COM/YISHU5  ·  4 SKILLS  ·  7 REPOS  ·  EST. 2025
  </text>
</svg>
